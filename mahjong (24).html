<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>四人麻雀 — 段位卓</title>
<style>
  :root{
    --felt:#0d4d3c; --gold:#c9a24b; --gold-bright:#e6c878;
    --ivory:#f3ead4; --ivory-edge:#d9cba8; --ink:#1a1a1a; --red:#b8312f;
    --wood:#2a1d12; --panel:#14241d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:radial-gradient(ellipse at 50% 30%,#1a3a2e 0%,#08251c 70%,#04140f 100%);
    color:var(--ivory);user-select:none;touch-action:manipulation;
  }
  #app{position:fixed;inset:0;}
  #game-screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  /* 左端の固定ボタンエリア */
  #left-btns{position:fixed;left:0;top:0;bottom:0;width:62px;z-index:46;
    display:flex;flex-direction:column;align-items:center;
    padding:12px 0;gap:8px;
    background:linear-gradient(180deg,rgba(8,28,22,.92),rgba(6,20,16,.92));
    border-right:1px solid rgba(201,162,75,.18);}
  /* 卓エリア: 横長。左端ボタン幅分ずらして中央配置 */
  #table-area{position:relative;
    width:min(98vw - 62px, 170vh);height:min(92vh,57vw);
    container-type:size;margin-left:62px;}
  /* 卓本体は横長の長方形 */
  #table-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:80cqw;height:82cqh;container-type:size;}

  /* 情報ボタン・戻る(左端エリア内) */
  #info-btn{width:46px;height:46px;border-radius:10px;border:1px solid var(--gold);
    background:linear-gradient(180deg,#1c3d30,#123026);color:var(--gold-bright);
    font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:none;}
  #info-btn:hover{background:linear-gradient(180deg,#27543f,#1a4030);}
  #info-screen{position:absolute;inset:0;z-index:80;
    background:radial-gradient(ellipse at 50% 35%,#1e4636 0%,#06201a 75%,#020c08 100%);
    overflow-y:auto;padding:24px;}
  .info-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
  #info-back{align-self:flex-start;padding:12px 24px;border-radius:24px;
    border:1px solid var(--gold);background:linear-gradient(180deg,#1c3d30,#123026);
    color:var(--ivory);font-family:inherit;font-size:16px;letter-spacing:.1em;cursor:pointer;}
  #info-back:hover{background:linear-gradient(180deg,#27543f,#1a4030);border-color:var(--gold-bright);}
  .side-card{background:linear-gradient(160deg,rgba(22,53,39,.85),rgba(10,33,24,.85));
    border:1px solid rgba(201,162,75,.35);border-radius:12px;padding:18px 20px;}
  .side-card h3{font-size:16px;color:var(--gold-bright);letter-spacing:.15em;
    margin-bottom:12px;font-weight:600;border-bottom:1px solid rgba(201,162,75,.25);padding-bottom:8px;}
  .legend-row{display:flex;align-items:center;gap:10px;font-size:15px;padding:5px 0;color:#cfe3d8;}
  .legend-dot{width:16px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(255,255,255,.3);}
  .help-text{font-size:14px;line-height:1.8;color:#cfe3d8;}
  #side-log{font-size:13px;line-height:1.7;color:#9fb8a8;font-family:"Yu Gothic",sans-serif;
    max-height:50vh;overflow-y:auto;}
  #side-log .log-line{padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06);}

  /* ===== タイトル ===== */
  #title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:28px;z-index:50;
    background:radial-gradient(ellipse at 50% 35%,#1e4636 0%,#06201a 75%,#020c08 100%);}
  #title h1{font-size:clamp(34px,9vw,68px);letter-spacing:.18em;
    background:linear-gradient(180deg,var(--gold-bright),var(--gold) 60%,#8a6c2a);
    -webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}
  #title .sub{color:#9fb8a8;letter-spacing:.4em;font-size:13px;margin-top:-14px;}
  .menu-card{background:linear-gradient(160deg,#16332700,#0c211a);
    border:1px solid rgba(201,162,75,.35);border-radius:14px;padding:22px 26px;
    box-shadow:0 10px 40px rgba(0,0,0,.5);min-width:280px;}
  .menu-card h2{font-size:15px;color:var(--gold-bright);letter-spacing:.2em;
    text-align:center;margin-bottom:16px;font-weight:600;}
  .mode-btn{display:block;width:100%;padding:14px 18px;margin:8px 0;
    background:linear-gradient(180deg,#1c3d30,#123026);
    border:1px solid rgba(201,162,75,.4);border-radius:10px;color:var(--ivory);
    font-family:inherit;font-size:16px;letter-spacing:.1em;cursor:pointer;transition:.18s;}
  .mode-btn:hover{background:linear-gradient(180deg,#27543f,#1a4030);
    border-color:var(--gold-bright);transform:translateY(-1px);}
  .mode-btn small{display:block;color:#8fa89a;font-size:11px;letter-spacing:.05em;margin-top:3px;}

  /* ===== 卓: 正方形コンテナ。全内部要素は cqmin 基準でサイズ決定 ===== */
  #felt{position:absolute;inset:0;border-radius:18px;
    background:
      repeating-linear-gradient(45deg,#0e5040 0 3px,#0d4b3c 3px 6px),
      linear-gradient(160deg,#0f5443,#0a3a2d);
    border:1.4cqmin solid var(--wood);
    box-shadow:0 0 0 .4cqmin var(--gold) inset,0 20px 60px rgba(0,0,0,.6);}
  #felt::after{content:"";position:absolute;inset:0;border-radius:14px;
    background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.32) 100%);
    pointer-events:none;}

  /* 中央情報 */
  /* 局情報バー: 画面上部中央 */
  #center{position:absolute;top:1.2vh;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;z-index:46;
    background:linear-gradient(160deg,rgba(10,44,34,.95),rgba(6,29,22,.95));
    border:1px solid var(--gold);border-radius:12px;padding:8px 22px;
    box-shadow:0 4px 16px rgba(0,0,0,.5);}
  #center .round{font-size:24px;color:var(--gold-bright);letter-spacing:.08em;font-weight:700;}
  #center .remain{font-size:16px;color:#9fb8a8;letter-spacing:.05em;}
  #center .honba{font-size:14px;color:#7d9488;}
  #center .dora-label{font-size:14px;color:var(--gold);letter-spacing:.15em;}
  #center .dora-mini{display:flex;gap:3px;}
  #center .dora-mini .tile{width:30px;height:42px;}
  #center .dora-mini .tile .num{font-size:21px;}
  #center .dora-mini .tile .suit{font-size:12px;}
  #center .dora-mini .tile .honor-char{font-size:24px;}
  #center .sticks{font-size:14px;color:var(--gold);}

  /* プレイヤー情報パネル(卓の四辺中央、内側) */
  .pinfo{position:absolute;z-index:7;background:rgba(8,28,22,.92);
    border:.15cqmin solid rgba(201,162,75,.4);border-radius:1cqmin;
    border-top:.4cqmin solid var(--owner-color,#c9a24b);
    padding:.5cqmin 1.2cqmin;text-align:center;min-width:11cqmin;
    display:flex;flex-direction:column;align-items:center;gap:.2cqmin;}
  .pinfo .nm-row{display:flex;align-items:center;gap:.4cqmin;}
  .pinfo .nm{color:#cfe3d8;font-size:1.7cqmin;}
  .pinfo .sc{color:var(--gold-bright);font-weight:700;font-size:2.4cqmin;
    font-family:"Yu Gothic",sans-serif;line-height:1;}
  .pinfo .wind{display:inline-block;width:2.4cqmin;height:2.4cqmin;line-height:2.4cqmin;
    border-radius:50%;background:var(--red);color:#fff;font-size:1.5cqmin;
    vertical-align:middle;flex:none;}
  .pinfo.active{border-color:var(--gold-bright);box-shadow:0 0 2cqmin rgba(230,200,120,.55);}
  .pinfo.riichi{border-color:var(--red);}
  /* 点数パネル: 卓の外(table-area)の四隅 */
  #pinfo0{bottom:0;right:0;transform:none;}
  #pinfo1{top:0;right:0;transform:none;}
  #pinfo2{top:0;left:0;transform:none;}
  #pinfo3{bottom:0;left:0;transform:none;}

  /* 牌 共通 */
  .tile{position:relative;background:linear-gradient(170deg,#fdfaf0,#e8dcc0);
    border:1px solid var(--ivory-edge);border-radius:.6cqmin;
    box-shadow:0 .2cqmin .3cqmin rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.7);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:var(--ink);overflow:hidden;flex:none;line-height:1;}
  .tile.back{background:linear-gradient(170deg,#2c6e54,#1d5240);border-color:#15402f;}
  .tile .face{display:flex;flex-direction:column;align-items:center;justify-content:center;
    width:100%;height:100%;gap:0;}
  .tile .num{line-height:.95;}
  .tile .suit{line-height:1;margin-top:.1cqmin;}
  /* フォントサイズは要素ごとに個別指定(下記) */
  #my-hand .tile .num{font-size:7cqh;}
  #my-hand .tile .suit{font-size:4cqh;}
  .river .tile .num{font-size:2.7cqmin;}
  .river .tile .suit{font-size:1.6cqmin;}
  .melds .tile .num{font-size:2.3cqmin;}
  .melds .tile .suit{font-size:1.4cqmin;}
  /* 字牌(1文字)は大きめ */
  #my-hand .tile .honor-char{font-size:8.5cqh;}
  .river .tile .honor-char{font-size:3.2cqmin;}
  .melds .tile .honor-char{font-size:2.7cqmin;}
  .opp-hand .tile .num,.opp-hand .tile .suit,.opp-hand .tile .honor-char{font-size:0;}
  .tile.pin .suit{color:#1b5fa8;} .tile.sou .suit{color:#1a7a3a;}
  .tile.honor.green{color:#1a7a3a;} .tile.honor.red{color:var(--red);}

  /* 自分の手牌 */
  #my-hand{position:absolute;bottom:2cqh;left:50%;transform:translateX(-50%);
    display:flex;gap:.6cqh;z-index:20;align-items:flex-end;}
  #my-hand .tile{width:9cqh;height:13cqh;font-size:7cqh;cursor:pointer;
    transition:transform .12s;}
  #my-hand .tile:hover{transform:translateY(-2cqh);}
  #my-hand .tile.drawn{margin-left:2.5cqh;}
  /* 鳴き選択時に関係する手牌を光らせる */
  #my-hand .tile.hand-highlight{box-shadow:0 0 2cqh .6cqh #6cd1a0;
    border-color:#6cd1a0;transform:translateY(-1.5cqh);
    animation:handglow .7s ease-in-out infinite;}
  @keyframes handglow{0%,100%{box-shadow:0 0 1.5cqh .3cqh #6cd1a0;}
    50%{box-shadow:0 0 3cqh .9cqh #6cd1a0;}}

  /* 他家手牌(裏) */
  .opp-hand{position:absolute;display:flex;z-index:8;}
  #opp1{right:2cqh;top:50%;transform:translateY(-50%);flex-direction:column;gap:.3cqh;}
  #opp2{top:2cqh;left:50%;transform:translateX(-50%);flex-direction:row;gap:.3cqh;}
  #opp3{left:2cqh;top:50%;transform:translateY(-50%);flex-direction:column;gap:.3cqh;}
  #opp1 .tile,#opp3 .tile{width:8cqh;height:5cqh;}
  #opp2 .tile{width:4cqh;height:9cqh;}

  /* 河(捨て牌): 各自の前に3行のブロックで表示 */
  .river{position:absolute;display:grid;gap:.3cqh;z-index:5;
    grid-template-columns:repeat(6,auto);grid-auto-rows:auto;}
  .river .tile{width:5cqh;height:6.8cqh;font-size:3.8cqh;}
  .river .tile .num{font-size:3.6cqh;} .river .tile .suit{font-size:2.1cqh;}
  .river .tile .honor-char{font-size:4.2cqh;}
  .river .tile.called{opacity:.35;}
  .river .tile.river-match{box-shadow:0 0 1.5cqh .4cqh #5aa0e0;border-color:#5aa0e0;z-index:8;}
  .river .tile.riichi-discard{transform:rotate(90deg);}
  /* 鳴き/ロン選択中の対象牌を点滅強調 */
  .river .tile.claim-target{box-shadow:0 0 2cqh .6cqh var(--gold-bright);
    border-color:var(--gold-bright);animation:claimblink .7s ease-in-out infinite;z-index:10;}
  @keyframes claimblink{0%,100%{box-shadow:0 0 1.2cqh .3cqh var(--gold-bright);}
    50%{box-shadow:0 0 3cqh .9cqh var(--gold-bright);}}
  /* 自分(下) */
  #river0{bottom:18cqh;left:50%;transform:translateX(-50%);}
  /* 対面(上) 180度回転 */
  #river2{top:18cqh;left:50%;transform:translateX(-50%) rotate(180deg);}
  /* 下家(右) 反時計回り90度 */
  #river1{right:18cqw;top:50%;transform:translateY(-50%) rotate(-90deg);}
  /* 上家(左) 時計回り90度 */
  #river3{left:18cqw;top:50%;transform:translateY(-50%) rotate(90deg);}

  /* 鳴き表示: 各家の外周端に配置 */
  .melds .tile{width:3cqmin;height:4cqmin;font-size:2cqmin;}
  .melds .tile .num{font-size:2cqmin;} .melds .tile .suit{font-size:1.2cqmin;}
  .melds .tile .honor-char{font-size:2.4cqmin;}
  /* 鳴き: 各家の点数パネルの近く(台外の隅)。横並び・折り返し */
  .melds{position:absolute;display:flex;gap:.6cqmin;z-index:9;flex-wrap:wrap;
    max-width:18cqw;}
  /* 鳴き: 各家の点数パネルの外側(上下方向に離す)。パネルと重ならない */
  #melds0{bottom:12cqh;right:.5cqw;justify-content:flex-end;}
  #melds1{top:12cqh;right:.5cqw;justify-content:flex-end;}
  #melds2{top:12cqh;left:.5cqw;justify-content:flex-start;}
  #melds3{bottom:12cqh;left:.5cqw;justify-content:flex-start;}
  /* 鳴き牌: 所有者色の枠+下線で誰の鳴きか明示 */
  .melds .meld{display:flex;align-items:center;padding:.3cqmin;border-radius:.6cqmin;
    border:.25cqmin solid var(--owner-color);
    box-shadow:0 0 1cqmin var(--owner-color);
    background:rgba(0,0,0,.25);}
  .melds .meld .called-tile{border-bottom:.4cqmin solid var(--owner-color);}
  .melds .meld .from-dot{width:1.8cqmin;height:1.8cqmin;border-radius:50%;
    margin-left:.4cqmin;flex:none;box-shadow:0 0 .6cqmin rgba(0,0,0,.5);
    border:.15cqmin solid rgba(255,255,255,.4);}
  /* 鳴いた牌(ロン/ポン/チー対象)を黄色強調 */
  .melds .meld .claimed-tile{background:linear-gradient(170deg,#fff3c4,#f0d878);
    box-shadow:0 0 1.2cqmin var(--gold-bright);
    border-color:var(--gold-bright);}

  /* 操作ボタン */
  #actions{position:absolute;bottom:11cqmin;left:50%;transform:translateX(-50%);
    display:flex;gap:1.5cqmin;z-index:30;}
  .act-btn{padding:1.6cqmin 3cqmin;border-radius:5cqmin;border:.25cqmin solid var(--gold);
    background:linear-gradient(180deg,#a8332f,#7d2320);color:#fff;font-family:inherit;
    font-size:3cqmin;font-weight:700;letter-spacing:.1em;cursor:pointer;
    box-shadow:0 .5cqmin 1.5cqmin rgba(0,0,0,.5);transition:.15s;}
  .act-btn:active{transform:scale(.94);}
  .act-btn.sub{background:linear-gradient(180deg,#1f4636,#143228);}
  .act-btn.skip{background:linear-gradient(180deg,#3a3a3a,#262626);border-color:#666;}
  /* アクション別の色分け */
  .act-btn.btn-tsumo{background:linear-gradient(180deg,#d4a017,#a87f0a);border-color:#ffe08a;}
  .act-btn.btn-ron{background:linear-gradient(180deg,#c0392b,#922b21);border-color:#ff8a7a;}
  .act-btn.btn-pon{background:linear-gradient(180deg,#2e6da4,#1f4e7a);border-color:#7ab8e6;}
  .act-btn.btn-chi{background:linear-gradient(180deg,#2e8b57,#1e6b3f);border-color:#7ae6a0;}
  .act-btn.btn-kan{background:linear-gradient(180deg,#7d3c98,#5b2c6f);border-color:#c89ae6;}
  .act-btn.btn-riichi{background:linear-gradient(180deg,#1f4636,#143228);border-color:var(--gold-bright);}

  /* 結果オーバーレイ */
  #overlay{position:absolute;inset:0;z-index:100;display:none;
    align-items:center;justify-content:center;background:rgba(2,12,8,.82);}
  .result-card{background:linear-gradient(165deg,#16352a,#0a2118);
    border:.3cqmin solid var(--gold);border-radius:2cqmin;padding:4cqmin 5cqmin;
    min-width:50cqmin;max-width:88cqmin;max-height:90cqmin;overflow-y:auto;text-align:center;}
  .result-card h2{color:var(--gold-bright);font-size:4.5cqmin;letter-spacing:.12em;margin-bottom:.6cqmin;}
  .result-card .winner{color:#cfe3d8;font-size:2.8cqmin;margin-bottom:2cqmin;}
  .yaku-list{text-align:left;margin:2.4cqmin 0;border-top:1px solid rgba(201,162,75,.3);
    border-bottom:1px solid rgba(201,162,75,.3);padding:1.6cqmin 0;}
  .yaku-list .row{display:flex;justify-content:space-between;font-size:2.6cqmin;
    padding:.3cqmin 0;color:#e3ead8;}
  .yaku-list .row .han{color:var(--gold-bright);}
  .result-card .score{font-size:5.5cqmin;color:var(--gold-bright);font-weight:700;
    margin:1.4cqmin 0;font-family:"Yu Gothic",sans-serif;}
  .result-card .han-fu{font-size:2.5cqmin;color:#9fb8a8;margin-bottom:2.4cqmin;}
  .next-btn{padding:2cqmin 6cqmin;border-radius:5cqmin;border:.25cqmin solid var(--gold);
    background:linear-gradient(180deg,#a8332f,#7d2320);color:#fff;font-family:inherit;
    font-size:3.2cqmin;font-weight:700;letter-spacing:.12em;cursor:pointer;margin-top:1.4cqmin;}
  .rank-row{display:flex;justify-content:space-between;align-items:center;
    padding:1.6cqmin 2.4cqmin;margin:.8cqmin 0;border-radius:1.4cqmin;font-size:3cqmin;
    background:rgba(255,255,255,.04);}
  .rank-row.first{background:linear-gradient(90deg,rgba(201,162,75,.25),transparent);
    border:1px solid var(--gold);}
  .rank-row .rk{color:var(--gold-bright);font-weight:700;width:7cqmin;text-align:left;}
  .rank-row .nm2{flex:1;text-align:left;color:#e3ead8;}
  .rank-row .sc2{color:var(--gold-bright);font-weight:700;font-family:"Yu Gothic",sans-serif;}

  /* トースト */
  #toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
    z-index:60;font-size:14cqmin;font-weight:700;letter-spacing:.1em;
    color:var(--gold-bright);text-shadow:0 0 4cqmin rgba(230,200,120,.6),0 .5cqmin 1cqmin rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:opacity .25s;}
  #toast.show{opacity:1;animation:pop .5s;}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);}
    60%{transform:translate(-50%,-50%) scale(1.15);}100%{transform:translate(-50%,-50%) scale(1);}}

  #log{position:absolute;left:1.5cqmin;top:1cqmin;z-index:4;font-size:1.7cqmin;
    color:rgba(125,148,136,.55);max-width:22cqmin;line-height:1.6;pointer-events:none;
    font-family:"Yu Gothic",sans-serif;}
  #sound-toggle{width:46px;height:46px;border-radius:10px;
    border:1px solid var(--gold);background:linear-gradient(180deg,#1c3d30,#123026);
    color:var(--gold-bright);font-size:20px;cursor:pointer;opacity:.9;user-select:none;
    flex:none;display:flex;align-items:center;justify-content:center;}
  #sound-toggle:hover{opacity:1;}
  .net-badge{position:absolute;top:1cqmin;right:1.5cqmin;z-index:40;font-size:1.8cqmin;
    color:#7d9488;letter-spacing:.1em;}

  /* ============================================================
   *  手牌傾向分析 UI
   * ============================================================ */

  /* 分析ボタン(左端エリア内縦並び) */
  .analysis-btn{width:46px;height:46px;border-radius:10px;
    border:1px solid rgba(201,162,75,.45);
    background:linear-gradient(180deg,#1c3d30,#123026);
    color:var(--gold-bright);font-size:11px;font-weight:700;letter-spacing:.04em;
    cursor:pointer;text-align:center;line-height:1.3;padding:4px 2px;margin-top:6px;
    transition:.2s;}
  .analysis-btn:hover{background:linear-gradient(180deg,#27543f,#1a4030);
    border-color:var(--gold-bright);}
  .analysis-btn.active{background:linear-gradient(180deg,#0f6e56,#085041);
    border-color:#5dcaa5;color:#fff;}
  @keyframes ablink{0%,100%{opacity:1;}50%{opacity:.35;}}
  .analysis-btn.blink{animation:ablink 1.1s ease-in-out infinite;
    border-color:var(--gold-bright);}

  /* 警告トースト */
  #analysis-warning{position:fixed;top:50%;left:68px;transform:translateY(-50%);z-index:90;
    background:rgba(184,49,47,.92);color:#fff;font-size:12px;letter-spacing:.05em;

<div id="app">

      <div class="side-card"><h3>操作方法</h3><div class="help-text">手牌をタップで打牌します。<br><br>鳴き（ポン・チー・カン）やロン・ツモができるときは、卓の下にボタンが出ます。色分けされたボタンを選んでください。<br><br>ツモ＝金 / ロン＝赤 / ポン＝青 / チー＝緑 / カン＝紫<br><br>鳴いた牌は黄色く光ります。鳴き面子の枠と点数パネルの色で、誰の持ち物か分かります。</div></div>

<script>
/* ============================================================
 *  麻雀エンジン  (mahjong engine)
 *  UI非依存・将来のネット対戦でもサーバ側でそのまま使える純ロジック
 *  牌表現: 数値 0..33
 *    0-8   : 1m-9m (萬子)
 *    9-17  : 1p-9p (筒子)
 *    18-26 : 1s-9s (索子)
 *    27-30 : 東南西北 (風牌 E S W N)
 *    31-33 : 白發中 (三元牌 P G R)  (白=31 發=32 中=33)
 *  赤ドラは別フラグ(redFives)で管理し、牌IDとしては5扱い
 * ============================================================ */
(function (global) {
  'use strict';

  const M = {}; // module exports

  // ---- 定数 ----
  const MAN = 0, PIN = 9, SOU = 18, HONOR = 27;
  M.MAN = MAN; M.PIN = PIN; M.SOU = SOU; M.HONOR = HONOR;
  M.E = 27; M.S = 28; M.W = 29; M.N = 30;
  M.HAKU = 31; M.HATSU = 32; M.CHUN = 33;

  M.TILE_NAMES = (() => {
    const a = [];
    for (let i = 1; i <= 9; i++) a.push(i + 'm');
    for (let i = 1; i <= 9; i++) a.push(i + 'p');
    for (let i = 1; i <= 9; i++) a.push(i + 's');
    a.push('東', '南', '西', '北', '白', '發', '中');
    return a;
  })();

  M.isHonor = t => t >= HONOR;
  M.isTerminal = t => !M.isHonor(t) && (t % 9 === 0 || t % 9 === 8);
  M.isYaochu = t => M.isHonor(t) || M.isTerminal(t);
  M.suitOf = t => t < PIN ? 'm' : t < SOU ? 'p' : t < HONOR ? 's' : 'z';
  M.numOf = t => M.isHonor(t) ? 0 : (t % 9) + 1;

  // ---- 牌山生成 ----
  M.buildWall = function () {
    const wall = [];
    for (let t = 0; t < 34; t++) for (let k = 0; k < 4; k++) wall.push(t);
    // シャッフル (Fisher-Yates)
    for (let i = wall.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [wall[i], wall[j]] = [wall[j], wall[i]];
    }
    return wall;
  };

  // 手牌を34配列(各牌の枚数)に変換
  M.toCounts = function (tiles) {
    const c = new Array(34).fill(0);
    for (const t of tiles) c[t]++;
    return c;
  };

  // ============================================================
  //  シャンテン数計算
  // ============================================================
  // 通常形シャンテン (面子手)
  //  melds = 確定面子数(鳴き)。 必要総面子 = 4
  //  シャンテン = (4 - sets)*2 - max(partials+pairs, ...) 系を全探索で最小化
  function shantenNormal(counts, melds) {
    let min = 8;
    const needSets = 4;
    // sets:完成面子, partials:塔子+対子(雀頭以外), hasPair:雀頭確保フラグ
    const rec = (idx, sets, partials, hasPair) => {
      while (idx < 34 && counts[idx] === 0) idx++;
      if (idx >= 34) {
        const s = sets + melds;
        // ブロック数(面子+塔子)は最大4まで有効、+雀頭1
        let useP = partials;
        if (s + useP > needSets) useP = needSets - s;
        if (useP < 0) useP = 0;
        let st = (needSets - s) * 2 - useP - (hasPair ? 1 : 0);
        if (st < min) min = st;
        return;
      }
      const s = sets + melds;
      const blocks = s + partials + (hasPair ? 1 : 0);

      // 刻子
      if (counts[idx] >= 3) {
        counts[idx] -= 3;
        rec(idx, sets + 1, partials, hasPair);
        counts[idx] += 3;
      }
      // 順子
      if (idx < HONOR && (idx % 9) <= 6 && counts[idx + 1] > 0 && counts[idx + 2] > 0) {
        counts[idx]--; counts[idx + 1]--; counts[idx + 2]--;
        rec(idx, sets + 1, partials, hasPair);
        counts[idx]++; counts[idx + 1]++; counts[idx + 2]++;
      }
      // 雀頭(対子を雀頭として確保)
      if (!hasPair && counts[idx] >= 2) {
        counts[idx] -= 2;
        rec(idx, sets, partials, true);
        counts[idx] += 2;
      }
      // 対子を塔子(刻子の種)として使う
      if (counts[idx] >= 2 && blocks < 5) {
        counts[idx] -= 2;
        rec(idx, sets, partials + 1, hasPair);
        counts[idx] += 2;
      }
      // 塔子(隣接)
      if (idx < HONOR && (idx % 9) <= 7 && counts[idx + 1] > 0 && blocks < 5) {
        counts[idx]--; counts[idx + 1]--;
        rec(idx, sets, partials + 1, hasPair);
        counts[idx]++; counts[idx + 1]++;
      }
      // 塔子(嵌張)
      if (idx < HONOR && (idx % 9) <= 6 && counts[idx + 2] > 0 && blocks < 5) {
        counts[idx]--; counts[idx + 2]--;
        rec(idx, sets, partials + 1, hasPair);
        counts[idx]++; counts[idx + 2]++;
      }
      // 孤立牌として1枚捨てる
      counts[idx]--;
      rec(idx, sets, partials, hasPair);
      counts[idx]++;
    };
    rec(0, 0, 0, false);
    return min;
  }

  // 七対子シャンテン
  function shantenChiitoi(counts) {
    let pairs = 0, kinds = 0;
    for (let i = 0; i < 34; i++) {
      if (counts[i] >= 2) pairs++;
      if (counts[i] >= 1) kinds++;
    }
    let st = 6 - pairs + Math.max(0, 7 - kinds);
    return st;
  }

  // 国士無双シャンテン
  function shantenKokushi(counts) {
    let kinds = 0, hasPair = 0;
    for (let i = 0; i < 34; i++) {
      if (M.isYaochu(i)) {
        if (counts[i] >= 1) kinds++;
        if (counts[i] >= 2) hasPair = 1;
      }
    }
    return 13 - kinds - hasPair;
  }

  // 総合シャンテン(鳴き無し前提でtiles=手牌全部, melds=鳴き面子数)
  const _shantenCache = new Map();
  M.shantenFromCounts = function (counts, melds = 0) {
    // キー生成(34桁)
    let key = melds;
    for (let i = 0; i < 34; i++) key = key * 5 + counts[i];
    const cached = _shantenCache.get(key);
    if (cached !== undefined) return cached;
    let s = shantenNormal(counts.slice(), melds);
    if (melds === 0) s = Math.min(s, shantenChiitoi(counts), shantenKokushi(counts));
    if (_shantenCache.size > 200000) _shantenCache.clear();
    _shantenCache.set(key, s);
    return s;
  };
  M.shanten = function (tiles, melds = 0) {
    return M.shantenFromCounts(M.toCounts(tiles), melds);
  };

  // 完成形判定: tilesは「鳴きを除いた手牌(和了牌含む)」, melds=鳴き面子数
  //  必要面子数 needSets = 4 - melds, それに雀頭1
  function isComplete(counts, needSets) {
    // 標準形
    if (canFormStandard(counts.slice(), needSets)) return true;
    return false;
  }
  function canFormStandard(counts, needSets) {
    // 雀頭を選んで残りを面子分解
    const rec = (idx, sets, pairUsed) => {
      while (idx < 34 && counts[idx] === 0) idx++;
      if (idx >= 34) return sets === needSets && pairUsed;
      // 雀頭
      if (!pairUsed && counts[idx] >= 2) {
        counts[idx] -= 2;
        if (rec(idx, sets, true)) { counts[idx] += 2; return true; }
        counts[idx] += 2;
      }
      // 刻子
      if (counts[idx] >= 3) {
        counts[idx] -= 3;
        if (rec(idx, sets + 1, pairUsed)) { counts[idx] += 3; return true; }
        counts[idx] += 3;
      }
      // 順子
      if (idx < HONOR && (idx % 9) <= 6 && counts[idx + 1] > 0 && counts[idx + 2] > 0) {
        counts[idx]--; counts[idx + 1]--; counts[idx + 2]--;
        if (rec(idx, sets + 1, pairUsed)) { counts[idx]++; counts[idx + 1]++; counts[idx + 2]++; return true; }
        counts[idx]++; counts[idx + 1]++; counts[idx + 2]++;
      }
      return false;
    };
    return rec(0, 0, false);
  }

  // 和了判定
  M.isAgari = function (tiles, melds = 0) {
    const counts = M.toCounts(tiles);
    // メモ化済みシャンテンで高速枝刈り(和了は必ず-1)
    if (M.shantenFromCounts(counts, melds) !== -1) return false;
    const needSets = 4 - melds;
    if (canFormStandard(counts.slice(), needSets)) return true;
    if (melds === 0) {
      let pairs = 0, ok = true;
      for (let i = 0; i < 34; i++) {
        if (counts[i] === 0) continue;
        if (counts[i] === 2) pairs++; else { ok = false; break; }
      }
      if (ok && pairs === 7) return true;
      if (shantenKokushi(counts) === -1) return true;
    }
    return false;
  };

  // テンパイ判定 + 待ち牌列挙 (tilesは3n+1枚, 鳴きを除く手牌)
  M.waits = function (tiles, melds = 0) {
    const w = [];
    const counts = M.toCounts(tiles);
    for (let t = 0; t < 34; t++) {
      if (counts[t] >= 4) continue;
      tiles.push(t);
      if (M.isAgari(tiles, melds)) w.push(t);
      tiles.pop();
    }
    return w;
  };
  // テンパイ判定
  M.isTenpai = function (tiles, melds = 0) {
    return M.waits(tiles, melds).length > 0;
  };

  // ============================================================
  //  面子分解 (役判定・符計算用に手牌を面子へ分解)
  //  返り値: { sets:[{type:'shun'|'kou', tiles:[...], open:bool}], pair:t }
  //  鳴き面子(openMelds)は別途与える
  // ============================================================
  function decomposeStandard(counts) {
    const results = [];
    const rec = (idx, pair, sets) => {
      while (idx < 34 && counts[idx] === 0) idx++;
      if (idx >= 34) {
        if (pair !== -1) results.push({ pair, sets: sets.map(s => ({ ...s })) });
        return;
      }
      // 雀頭
      if (pair === -1 && counts[idx] >= 2) {
        counts[idx] -= 2;
        rec(idx, idx, sets);
        counts[idx] += 2;
      }
      // 刻子
      if (counts[idx] >= 3) {
        counts[idx] -= 3;
        sets.push({ type: 'kou', t: idx });
        rec(idx, pair, sets);
        sets.pop();
        counts[idx] += 3;
      }
      // 順子
      if (idx < HONOR && (idx % 9) <= 6 && counts[idx + 1] > 0 && counts[idx + 2] > 0) {
        counts[idx]--; counts[idx + 1]--; counts[idx + 2]--;
        sets.push({ type: 'shun', t: idx });
        rec(idx, pair, sets);
        sets.pop();
        counts[idx]++; counts[idx + 1]++; counts[idx + 2]++;
      }
    };
    rec(0, -1, []);
    return results;
  }

  // ============================================================
  //  役判定 + 点数計算
  //  ctx: {
  //    hand: [手牌(和了牌含まない13枚 or 鳴き除く部分)],
  //    winTile: 和了牌,
  //    melds: [{type:'chi'|'pon'|'kan'|'ankan', tiles:[...]}],
  //    tsumo: bool,
  //    riichi: bool, doubleRiichi: bool, ippatsu: bool,
  //    seatWind: 27..30, roundWind: 27..30,
  //    dora: [表ドラ牌...], uraDora:[...], aka: 赤5の枚数,
  //    haitei: bool, houtei: bool, rinshan: bool, chankan: bool,
  //    isParent: bool (親),
  //    tenhou/chiihou は省略
  //  }
  // ============================================================
  M.score = function (ctx) {
    const allTiles = ctx.hand.concat([ctx.winTile]);
    const melds = ctx.melds || [];
    const isMenzen = melds.every(m => m.type === 'ankan'); // 暗槓のみなら門前維持
    const concealed = melds.length === 0 || isMenzen;

    // 全牌count (鳴き含む全14枚相当)
    const allCounts = new Array(34).fill(0);
    for (const t of allTiles) allCounts[t]++;
    for (const m of melds) for (const t of m.tiles) allCounts[t]++;

    let best = null;

    // --- 国士無双 ---
    {
      const k = shantenKokushi(M.toCounts(allTiles));
      if (melds.length === 0 && k === -1) {
        // 13面待ちか
        const c = M.toCounts(ctx.hand);
        let pairTile = -1;
        for (let i = 0; i < 34; i++) if (M.isYaochu(i) && c[i] >= 1) { if (c[i] >= 2) pairTile = i; }
        const thirteen = ctx.hand.filter(t => M.isYaochu(t)).length === 13 &&
          new Set(ctx.hand).size === 13;
        const yaku = thirteen
          ? [{ name: '国士無双十三面', han: 26 }]
          : [{ name: '国士無双', han: 13 }];
        return finalize(ctx, yaku, 20, true);
      }
    }

    // --- 七対子 ---
    {
      const c = M.toCounts(allTiles);
      let pairs = 0, ok = true;
      for (let i = 0; i < 34; i++) {
        if (c[i] === 0) continue;
        if (c[i] === 2) pairs++; else { ok = false; break; }
      }
      if (melds.length === 0 && ok && pairs === 7) {
        const yaku = buildYaku(ctx, {
          chiitoi: true, concealed: true,
          pairs: Array.from({ length: 34 }, (_, i) => i).filter(i => c[i] === 2),
          sets: [], pair: -1, allCounts, melds, isMenzen: true
        });
        const cand = finalize(ctx, yaku, 25, false, { chiitoi: true });
        if (!best || cand.total > best.total) best = cand;
      }
    }

    // --- 通常形 ---
    {
      // 鳴き牌を除いた手牌部分を分解
      const handCounts = M.toCounts(allTiles);
      // 鳴き面子分は既に確定しているので分解対象から除外しない(allTilesは鳴き除く想定)
      const decomps = decomposeStandard(handCounts);
      for (const d of decomps) {
        const sets = [];
        for (const s of d.sets) {
          sets.push({ type: s.type, t: s.t, open: false });
        }
        for (const m of melds) {
          if (m.type === 'chi') sets.push({ type: 'shun', t: Math.min(...m.tiles), open: true, kan: false });
          else if (m.type === 'pon') sets.push({ type: 'kou', t: m.tiles[0], open: true, kan: false });
          else if (m.type === 'kan') sets.push({ type: 'kou', t: m.tiles[0], open: true, kan: true });
          else if (m.type === 'ankan') sets.push({ type: 'kou', t: m.tiles[0], open: false, kan: true });
        }
        const yaku = buildYaku(ctx, {

    let ctx=null, enabled=true;
    function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ enabled=false; } } return ctx; }
    function resume(){ const c=ac(); if(c && c.state==='suspended') c.resume(); }
    // 短いノイズ的な打牌音(牌が当たるカチッ)
    function tap(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      // クリック: 高周波の短いノイズ
      const buf=c.createBuffer(1, c.sampleRate*0.04, c.sampleRate);
      const data=buf.getChannelData(0);
      for(let i=0;i<data.length;i++){ data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,3); }
      const src=c.createBufferSource(); src.buffer=buf;
      const g=c.createGain(); g.gain.value=0.25;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2600; f.Q.value=1.2;
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start(t);
      // 木のコッという低音
      const o=c.createOscillator(); o.type='triangle'; o.frequency.setValueAtTime(420,t);
      o.frequency.exponentialRampToValueAtTime(180,t+0.05);
      const g2=c.createGain(); g2.gain.setValueAtTime(0.3,t); g2.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      o.connect(g2); g2.connect(c.destination); o.start(t); o.stop(t+0.1);
    }
    // ツモ音(柔らかいポッ)
    function draw(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(660,t);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+0.1);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.12);
    }
    // 鳴き(ポン/チー) 二音
    function call(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      [0,0.09].forEach((dt,i)=>{
        const o=c.createOscillator(); o.type='square';
        o.frequency.setValueAtTime(i?520:390,t+dt);
        const g=c.createGain(); g.gain.setValueAtTime(0.0001,t+dt);
        g.gain.exponentialRampToValueAtTime(0.13,t+dt+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.12);
        o.connect(g); g.connect(c.destination); o.start(t+dt); o.stop(t+dt+0.14);
      });
    }
    // リーチ(下降する涼やかな音)
    function riichi(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(880,t);
      o.frequency.exponentialRampToValueAtTime(440,t+0.4);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.55);
    }
    // 和了(上昇アルペジオ)
    function win(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      [523,659,784,1047].forEach((f,i)=>{
        const o=c.createOscillator(); o.type='triangle'; o.frequency.value=f;
        const g=c.createGain(); const dt=i*0.1;
        g.gain.setValueAtTime(0.0001,t+dt); g.gain.exponentialRampToValueAtTime(0.22,t+dt+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,t+dt+0.4);
        o.connect(g); g.connect(c.destination); o.start(t+dt); o.stop(t+dt+0.45);
      });
    }
    // 流局(中立的な低い音)
    function draw_end(){
      const c=ac(); if(!c||!enabled) return;
      const t=c.currentTime;
      const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(330,t);
      o.frequency.linearRampToValueAtTime(247,t+0.3);
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.15,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.45);
    }
    return { tap, draw, call, riichi, win, draw_end, resume,
      toggle:()=>{enabled=!enabled; return enabled;}, isOn:()=>enabled };
  })();

  // ---- 牌描画 ----
  const SUIT_CLASS = ['man','pin','sou'];
  function tileEl(tile, faceDown){
    const e = el('div','tile');
    if(faceDown){ e.classList.add('back'); return e; }
    const face = el('div','face');
    if(tile < MJ.HONOR){
      const suitIdx = Math.floor(tile/9);
      const num = (tile%9)+1;
      e.classList.add(SUIT_CLASS[suitIdx]);
      const n = el('div','num'); n.textContent = num;
      const s = el('div','suit'); s.textContent = ['萬','筒','索'][suitIdx];
      face.appendChild(n); face.appendChild(s);
    } else {
      const names = {27:'東',28:'南',29:'西',30:'北',31:'白',32:'發',33:'中'};
      const n = el('div','num honor-char'); n.textContent = names[tile];
      if(tile===32){ e.classList.add('honor','green'); }
      else if(tile===33){ e.classList.add('honor','red'); }
      else e.classList.add('honor');
      face.appendChild(n);
    }
    e.appendChild(face);
    return e;
  }

  // ---- タイトル/メニュー ----
  function showTitle(){
    $('#title').style.display='flex';
    $('#game-screen').style.visibility='hidden';
    $('#info-screen').style.display='none';
  }
  function startGame(mode){
    Sound.resume();
    $('#title').style.display='none';
    $('#game-screen').style.visibility='visible';
    game = new Game({
      mode,
      onUpdate: handleUpdate,
      onLog: (m)=>pushLog(m),
    });
    busy=false;
    game.startKyoku();
  }

  // ---- ログ ----
  const logLines=[];
  function pushLog(m){ logLines.push(m); if(logLines.length>40)logLines.shift();
    const sl=$('#side-log');
    if(sl){ sl.innerHTML=logLines.slice(-30).reverse().map(x=>'<div class="log-line">'+x+'</div>').join(''); }
  }

  // ---- トースト(ポン/チー/リーチ/ツモ等) ----
  function toast(text){
    const t=$('#toast'); t.textContent=text; t.classList.remove('show');
    void t.offsetWidth; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),900);
  }

  // ============================================================
  //  ゲームイベント処理
  // ============================================================
  function handleUpdate(ev){
    switch(ev.type){
      case 'draw': Sound.draw(); onDraw(ev); break;
      case 'discard': Sound.tap(); render(); break;
      case 'claims': onClaims(ev); break;
      case 'pon': Sound.call(); toast('ポン'); render(); afterMeld(ev.pid); break;
      case 'chi': Sound.call(); toast('チー'); render(); afterMeld(ev.pid); break;
      case 'riichi': Sound.riichi(); toast('リーチ'); render(); break;
      case 'kyokuEnd': onKyokuEnd(ev); break;
      case 'gameEnd': onGameEnd(ev); break;
    }
  }

  function onDraw(ev){
    render();
    const pid = ev.pid;
    if(pid===0){
      // 自分の番: ツモ和了可能ならボタン、操作待ち
      busy=false;
      showMyActions(ev);
    } else {
      // AIの番
      busy=true;
      setTimeout(()=>aiTurn(pid), 480);
    }
  }

  // 自分のツモ後アクション表示
  function showMyActions(ev){
    const acts=$('#actions'); acts.innerHTML='';
    const p=game.players[0];
    // ツモ和了
    if(ev.canTsumo){
      const b=el('button','act-btn btn-tsumo'); b.textContent='ツモ';
      b.onclick=()=>{ clearActions(); game.applyTsumo(0); };
      acts.appendChild(b);
    }
    // リーチ
    if(p.isMenzen() && !p.riichi && p.score>=1000 && MJ.isTenpai(p.hand,p.meldCount())
        && game.remainTiles()>=4){
      const b=el('button','act-btn btn-riichi'); b.textContent='リーチ';
      b.onclick=()=>{ riichiMode=true; b.style.borderColor='#e6c878';
        toast('リーチ：捨て牌を選択'); game.declareRiichi(0); render(); enableHandSelection(); };
      acts.appendChild(b);
    }
    // 暗槓
    const ankanT = AI.shouldAnkan(game,0)!==null ? findAnkan(p) : null;
    if(ankanT!=null && !p.riichi){
      const b=el('button','act-btn btn-kan'); b.textContent='カン';
      b.onclick=()=>{ clearActions(); game.doAnkan(0,ankanT); };
      acts.appendChild(b);
    }
    // 加槓
    const kakanT = findKakan(p);
    if(kakanT!=null && !p.riichi){
      const b=el('button','act-btn btn-kan'); b.textContent='加カン';
      b.onclick=()=>{ clearActions(); game.doKakan(0,kakanT); };
      acts.appendChild(b);
    }
    enableHandSelection();
  }
  function findAnkan(p){const c=MJ.toCounts(p.hand);for(let t=0;t<34;t++)if(c[t]===4)return t;return null;}
  function findKakan(p){const c=MJ.toCounts(p.hand);
    for(const m of p.melds)if(m.type==='pon'&&c[m.tiles[0]]>=1)return m.tiles[0];return null;}

  let riichiMode=false;
  let highlightDiscard=null;
  let highlightHandTiles=null;
  let hoverTile=null;
  function clearActions(){ $('#actions').innerHTML=''; riichiMode=false; disableHandSelection();
    if(highlightDiscard||highlightHandTiles){ highlightDiscard=null; highlightHandTiles=null; render(); } }

  // 自分の手牌タップで打牌
  function enableHandSelection(){
    const p=game.players[0];
    [...$('#my-hand').children].forEach((te,idx)=>{
      te.classList.remove('disabled');
      const tile=parseInt(te.dataset.tile,10);
      te.onclick=()=>{
        if(busy) return;
        clearActions();
        hoverTile=null;
        game.discard(0,tile);
      };
      // hoverで河の同じ牌を光らせる
      te.onmouseenter=()=>{ if(busy)return; hoverTile=tile; markRiverHover(); };
      te.onmouseleave=()=>{ hoverTile=null; markRiverHover(); };
    });
  }
  // 河の中で hoverTile と同じ牌を光らせる(再描画せず直接クラス操作)
  function markRiverHover(){
    for(let i=0;i<4;i++){
      const c=$('#river'+i); if(!c)continue;
      const ds=game.players[i].discards;
      [...c.children].forEach((te,idx)=>{
        const t=ds[idx]?ds[idx].tile:-1;
        te.classList.toggle('river-match', hoverTile!=null && t===hoverTile);
      });
    }
  }
  function disableHandSelection(){
    [...$('#my-hand').children].forEach(te=>te.onclick=null);
  }

  // ---- 鳴き候補(claims) ----
  function onClaims(ev){
    const {claims, discardPid, tile} = ev;
    // 1) 自分(pid 0)がロン/ポン/チー/カンできるか確認 → ボタン表示
    const myRon = claims.ron.find(r=>r.pid===0);
    const myPon = claims.pon.find(c=>c.pid===0);
    const myKan = claims.kan.find(c=>c.pid===0);
    const myChi = claims.chi.find(c=>c.pid===0);

    // AIのロン優先処理(自分含め全員)。頭ハネ: 打牌者の下家から順
    const ronOrder = claims.ron.slice().sort((a,b)=>
      ((a.pid-discardPid+4)%4)-((b.pid-discardPid+4)%4));

    // AIのロン(自分以外)は即適用
    const aiRon = ronOrder.find(r=>r.pid!==0);
    // 自分がロンできるなら選択UI、AIロンと競合時は座順
    if(myRon){
      // 自分がロン可能: UI表示(スキップ可)
      showClaimUI({ron:myRon, pon:myPon, kan:myKan, chi:myChi}, discardPid, tile, ronOrder);
      return;
    }
    // 自分にロンなし → AIロンがあれば適用
    if(aiRon){
      game.applyRon([aiRon], discardPid);
      return;
    }
    // 自分にポン/チー/カンがあるならUI
    if(myPon||myKan||myChi){
      showClaimUI({pon:myPon,kan:myKan,chi:myChi}, discardPid, tile, []);
      return;
    }
    // AIの鳴き判定
    resolveAiClaims(claims, discardPid, tile);
  }

  function showClaimUI(my, discardPid, tile, ronOrder){
    const acts=$('#actions'); acts.innerHTML='';
    // 鳴き/ロン対象の捨て牌をハイライト
    highlightDiscard={pid:discardPid, tile}; render();
    const setHL=(tiles)=>{ highlightHandTiles=tiles; render(); };
    const clrHL=()=>{ highlightHandTiles=null; render(); };
    if(my.ron){
      const b=el('button','act-btn btn-ron'); b.textContent='ロン';
      // ロンは和了牌が手牌の待ち。手牌全体は光らせず捨て牌のみ強調
      b.onclick=()=>{ acts.innerHTML=''; game.applyRon([my.ron], discardPid); };
      acts.appendChild(b);
    }
    if(my.pon){
      const b=el('button','act-btn btn-pon'); b.textContent='ポン';
      b.onmouseenter=()=>setHL([tile,tile]); b.onmouseleave=clrHL;
      b.onclick=()=>{ acts.innerHTML=''; game.doPon(0,tile); afterMeld(0); };
      acts.appendChild(b);
    }
    if(my.kan){
      const b=el('button','act-btn btn-kan'); b.textContent='カン';
      b.onmouseenter=()=>setHL([tile,tile,tile]); b.onmouseleave=clrHL;
      b.onclick=()=>{ acts.innerHTML=''; game.doKanMin(0,tile); };
      acts.appendChild(b);
    }
    if(my.chi){
      my.chi.seqs.forEach((seq,i)=>{
        const b=el('button','act-btn btn-chi');
        b.textContent='チー'+(my.chi.seqs.length>1?(i+1):'');
        b.onmouseenter=()=>setHL(seq.slice()); b.onmouseleave=clrHL;
        b.onclick=()=>{ acts.innerHTML=''; game.doChi(0,tile,seq); afterMeld(0); };
        acts.appendChild(b);
      });
    }
    const skip=el('button','act-btn skip'); skip.textContent='スキップ';
    skip.onclick=()=>{
      acts.innerHTML='';
      // 自分がスキップ → AIロン(あれば)・AI鳴き処理へ
      const aiRon=(ronOrder||[]).find(r=>r.pid!==0);
      if(aiRon){ game.applyRon([aiRon],discardPid); return; }
      resolveAiClaims(game.pendingClaims, discardPid, tile);
    };
    acts.appendChild(skip);
  }

  // AIの鳴き判定 → 適用 or 流す
  function resolveAiClaims(claims, discardPid, tile){
    // ポン/カン優先(座順関係なく)。1人だけ拾う
    for(const c of (claims.pon||[])){
      if(c.pid===0) continue;
      if(AI.shouldClaim(game,c.pid,{type:'pon',tile})){
        game.doPon(c.pid,tile); afterMeld(c.pid); return;
      }
    }
    for(const c of (claims.chi||[])){
      if(c.pid===0) continue;
      if(AI.shouldClaim(game,c.pid,{type:'chi',tile})){
        game.doChi(c.pid,tile,c.seqs[0]); afterMeld(c.pid); return;
      }
    }
    // 誰も鳴かない → 次の手番へ
    game.advanceTurn(discardPid);
  }

  // 鳴いた後: そのプレイヤーが打牌する番
  function afterMeld(pid){
    render();
    if(pid===0){
      busy=false;
      const acts=$('#actions'); acts.innerHTML='';
      // 鳴き後は打牌のみ(ツモ和了なし)
      enableHandSelection();
    } else {
      busy=true;
      setTimeout(()=>aiDiscard(pid), 450);
    }
  }

  // ---- AIの手番(ツモ→打牌) ----
  function aiTurn(pid){
    const p=game.players[pid];
    // ツモ和了
    if(game.checkTsumo(pid)){
      // AIは和了できれば必ず和了
      game.applyTsumo(pid);
      return;
    }
    // 暗槓
    const ankan=AI.shouldAnkan(game,pid);
    if(ankan!==null){
      game.doAnkan(pid,ankan);
      return; // 嶺上ツモで再度draw→aiTurnが呼ばれる
    }
    aiDiscard(pid);
  }
  function aiDiscard(pid){
    const p=game.players[pid];
    // リーチ判断
    if(AI.shouldRiichi(game,pid)){
      game.declareRiichi(pid);
    }
    const tile=AI.chooseDiscard(game,pid);
    render();
    setTimeout(()=>{ game.discard(pid,tile); }, 200);
  }

  // ============================================================
  //  描画
  // ============================================================
  function render(){
    if(!game) return;
    // 中央
    $('#round-name').textContent=game.kyokuName().replace(/\s.*$/,'');
    $('#remain').textContent='残'+game.remainTiles();
    $('#honba-disp').textContent=game.honba>0?(game.honba+'本場'):'';
    $('#sticks').textContent=game.riichiSticks>0?('供託 '+game.riichiSticks*1000):'';
    const dm=$('#dora-mini'); dm.innerHTML='';
    game.doraIndicators.forEach(t=>{const te=tileEl(t,false); dm.appendChild(te);});

    // プレイヤー情報
    const windCh={27:'東',28:'南',29:'西',30:'北'};
    for(let i=0;i<4;i++){
      const p=game.players[i];
      const pi=$('#pinfo'+i);
      pi.querySelector('.nm').textContent=p.name;
      pi.querySelector('.sc').textContent=p.score;
      pi.querySelector('.wind').textContent=windCh[p.seatWind];
      pi.classList.toggle('active', game.turn===i && game.phase!=='end');
      pi.classList.toggle('riichi', p.riichi);
      pi.style.setProperty('--owner-color', PLAYER_COLOR[i]);
    }

    renderMyHand();
    renderOpps();
    renderRivers();
    renderMelds();
    // 分析パネル自動更新
    if(analysisPid!==null) refreshAnalysisPanel();
    updateAnalysisBtn();
  }

  function renderMyHand(){
    const c=$('#my-hand'); c.innerHTML='';
    const p=game.players[0];
    const drawn=p.drawnTile;
    const hand=p.hand.slice();
    const display=hand.slice();
    if(drawn!=null && game.turn===0){
      const di=display.lastIndexOf(drawn);
      if(di>=0) display.splice(di,1);
    }
    // ハイライト対象(鳴きに使う手牌)を1枚ずつ消費
    const hl = highlightHandTiles ? highlightHandTiles.slice() : [];
    const markIfNeeded = (te,t)=>{
      const idx=hl.indexOf(t);
      if(idx>=0){ te.classList.add('hand-highlight'); hl.splice(idx,1); }
    };
    display.forEach(t=>{ const te=tileEl(t,false); te.dataset.tile=t; markIfNeeded(te,t); c.appendChild(te); });
    if(drawn!=null && game.turn===0){
      const te=tileEl(drawn,false); te.dataset.tile=drawn; te.classList.add('drawn');
      markIfNeeded(te,drawn); c.appendChild(te);
    }
  }
  function renderOpps(){
    for(let i=1;i<=3;i++){
      const c=$('#opp'+i); c.innerHTML='';
      const p=game.players[i];
      const n=p.hand.length;
      for(let k=0;k<n;k++) c.appendChild(tileEl(0,true));
    }
  }
  function renderRivers(){
    for(let i=0;i<4;i++){
      const c=$('#river'+i); c.innerHTML='';
      const ds=game.players[i].discards;
      ds.forEach((d,idx)=>{
        const te=tileEl(d.tile,false);
        if(d.called) te.classList.add('called');
        if(d.riichi) te.classList.add('riichi-discard');
        // 鳴き/ロン対象としてハイライト中の最新打牌
        if(highlightDiscard && highlightDiscard.pid===i && idx===ds.length-1){
          te.classList.add('claim-target');
        }
        c.appendChild(te);
      });
    }
  }
  // プレイヤー識別色(自分=金, 下家=青, 対面=赤, 上家=緑)
  const PLAYER_COLOR = ['#e6c878','#4a90d9','#d9534f','#5cb85c'];
  const PLAYER_LABEL = ['自分','下家','対面','上家'];

  function renderMelds(){
    for(let i=0;i<4;i++){
      const c=$('#melds'+i); c.innerHTML='';
      game.players[i].melds.forEach(m=>{
        const md=el('div','meld');
        md.style.setProperty('--owner-color', PLAYER_COLOR[i]);
        md.classList.add('owner-'+i);
        if(m.type==='ankan'){
          [0,m.tiles[0],m.tiles[0],0].forEach((t,idx)=>{
            md.appendChild(tileEl(t, idx===0||idx===3));
          });
        } else {
          let calledMarked=false;
          m.tiles.forEach((t)=>{
            const te=tileEl(t,false);
            te.classList.add('called-tile');
            // 鳴いた牌(calledTile)を1枚だけ強調
            if(!calledMarked && t===m.calledTile){ te.classList.add('claimed-tile'); calledMarked=true; }
            md.appendChild(te);
          });
          // 鳴き元を示す色ドット(誰から鳴いたか)
          if(m.from!=null && m.from!==i){
            const dot=el('div','from-dot');
            dot.style.background=PLAYER_COLOR[m.from];
            dot.title=PLAYER_LABEL[m.from]+'から';
            md.appendChild(dot);
          }
        }
        c.appendChild(md);
      });
    }
  }

  // ============================================================
  //  局/ゲーム終了
  // ============================================================
  function onKyokuEnd(ev){
    busy=true; render();
    if(ev.kind==='ryuukyoku') Sound.draw_end(); else Sound.win();
    const ov=$('#overlay'); const card=$('#result-card');
    card.innerHTML='';
    if(ev.kind==='ryuukyoku'){
      card.appendChild(headerEl('流局',''));
      const info=ev.info;
      const t=el('div'); t.style.cssText='color:#cfe3d8;font-size:14px;margin:10px 0;';
      const names=info.tenpai.map(i=>game.players[i].name);
      t.textContent= names.length? ('テンパイ: '+names.join('、')) : '全員ノーテン';
      card.appendChild(t);
    } else {
      const r=ev.info.result;
      const w=game.players[ev.info.winner];
      card.appendChild(headerEl(ev.kind==='tsumo'?'ツモ和了':'ロン和了', w.name));
      // 役一覧
      const yl=el('div','yaku-list');
      r.yaku.forEach(y=>{
        const row=el('div','row');
        const nm=el('span'); nm.textContent=y.name;
        const han=el('span','han'); han.textContent=(y.han>=13?'役満':y.han+'翻');
        row.appendChild(nm); row.appendChild(han); yl.appendChild(row);
      });
      if(r.dora>0){
        const row=el('div','row'); const nm=el('span'); nm.textContent='ドラ';
        const han=el('span','han'); han.textContent=r.dora+'翻';
        row.appendChild(nm);row.appendChild(han);yl.appendChild(row);
      }
      card.appendChild(yl);
      const sc=el('div','score');
      sc.textContent=r.total.toLocaleString()+'点';
      card.appendChild(sc);
      const hf=el('div','han-fu');
      hf.textContent=(r.label?r.label+' ':'')+(r.yakuman?'':(r.han+'翻 '+r.fu+'符'));
      card.appendChild(hf);
    }
    const btn=el('button','next-btn'); btn.textContent='次へ';
    btn.onclick=()=>{ ov.style.display='none'; busy=false; game.proceedNext(); };
    card.appendChild(btn);
    ov.style.display='flex';
  }
  function headerEl(title,winner){
    const h=el('div');
    const h2=el('h2'); h2.textContent=title; h.appendChild(h2);
    if(winner){const w=el('div','winner'); w.textContent=winner; h.appendChild(w);}
    return h;
  }

  function onGameEnd(ev){
    const ov=$('#overlay'); const card=$('#result-card'); card.innerHTML='';
    card.appendChild(headerEl('最終結果',''));
    const wrap=el('div'); wrap.style.cssText='margin:14px 0;';
    ev.ranking.forEach((p,i)=>{
      const row=el('div','rank-row'+(i===0?' first':''));
      const rk=el('span','rk'); rk.textContent=(i+1)+'位';
      const nm=el('span','nm2'); nm.textContent=p.name;
      const sc=el('span','sc2'); sc.textContent=p.score.toLocaleString();
      row.appendChild(rk);row.appendChild(nm);row.appendChild(sc);
      wrap.appendChild(row);
    });
    card.appendChild(wrap);
    const btn=el('button','next-btn'); btn.textContent='タイトルへ';
    btn.onclick=()=>{ ov.style.display='none'; showTitle(); };
    card.appendChild(btn);
    ov.style.display='flex';
  }

  // ============================================================
  //  手牌傾向分析エンジン
  //  捨て牌・鳴き・局状況から各カテゴリのスコアを計算し%で返す
  // ============================================================
  function analyzePlayer(pid){
    if(!game) return null;
    const p = game.players[pid];
    const discards = p.discards; // [{tile, riichi, called}]
    const melds = p.melds;
    const n = discards.length;
    if(n === 0) return null;

    // 残り牌数から守備フェーズか判定
    const remain = game.remainTiles();
    const otherRiichi = game.players.some((q,i)=> i!==pid && q.riichi);

    // 捨て牌を分類
    let manCount=0, pinCount=0, souCount=0, honorCount=0;
    let terminalCount=0, simpleCount=0; // 端牌・中張牌
    let earlyDiscard=[]; // 最初の4枚
    let lateDiscard=[];  // 5枚目以降

    discards.forEach((d,idx)=>{
      const t = d.tile;
      if(MJ.isHonor(t)) honorCount++;
      else {
        const suit=MJ.suitOf(t), num=MJ.numOf(t);
        if(suit==='m') manCount++;
        else if(suit==='p') pinCount++;
        else souCount++;
        if(num<=2||num>=8) terminalCount++;
        else simpleCount++;
      }
      if(idx<4) earlyDiscard.push(d.tile);
      else lateDiscard.push(d.tile);
    });

    const suuhai = manCount+pinCount+souCount; // 数牌の捨て枚数

    // --- 各スコア計算 ---

    // 【染め手スコア】
    // 数牌捨てが偏っていたら逆(=その色を温存)→染め手
    let dyeScore = 0;
    if(suuhai >= 2){
      const maxSuit = Math.max(manCount,pinCount,souCount);
      const minSuit = Math.min(manCount,pinCount,souCount);
      // 捨て牌で1色がほとんどない = その色を温存している
      if(minSuit === 0 && suuhai >= 4) dyeScore += 40;
      else if(minSuit <= 1 && suuhai >= 5) dyeScore += 30;
      else if(suuhai > 0){
        const ratio = (suuhai - minSuit) / suuhai;
        dyeScore += ratio * 25;
      }
    }
    // ポンがあれば染め手＋役牌ポン → 混一色の可能性UP
    const ponMelds = melds.filter(m=>m.type==='pon'||m.type==='kan');
    const honorPon = ponMelds.filter(m=>MJ.isHonor(m.tiles[0])).length;
    dyeScore += honorPon * 8;
    // チーがあれば×1.2
    if(melds.some(m=>m.type==='chi')) dyeScore *= 1.2;
    dyeScore = Math.min(dyeScore, 95);

    // 【順子手スコア】
    // 序盤に字牌・端牌から切る = 中張牌温存 = 順子手
    let shunScore = 30; // ベース
    const earlyYaochu = earlyDiscard.filter(t=>MJ.isYaochu(t)).length;
    const earlySimple = earlyDiscard.filter(t=>!MJ.isYaochu(t)&&(MJ.numOf(t)>=3&&MJ.numOf(t)<=7)).length;
    // 序盤に幺九牌を切っている = 順子手向き
    shunScore += earlyYaochu * 8;
    // 序盤に中張牌を切っている = 順子手でない可能性
    shunScore -= earlySimple * 6;
    // チーがあれば順子手確度UP
    if(melds.some(m=>m.type==='chi')) shunScore += 20;
    // 鳴きがなく字牌・端牌を多く捨てている
    const yaochuRatio = (honorCount+terminalCount)/n;
    shunScore += yaochuRatio * 15;
    shunScore = Math.max(5, Math.min(shunScore, 90));

    // 【対子手/七対子スコア】
    // 捨て牌がバラバラ1枚ずつ = 七対子の可能性
    // 同じ牌が2枚以上捨てられていたら七対子はほぼなし
    const tileFreq={};
    discards.forEach(d=>{ tileFreq[d.tile]=(tileFreq[d.tile]||0)+1; });
    const dupCount = Object.values(tileFreq).filter(v=>v>=2).length;
    const uniqueCount = Object.keys(tileFreq).length;
    let toitsuScore = 15;
    if(dupCount === 0 && n >= 4) toitsuScore += 20; // 全て違う牌 = 七対子可能性
    if(dupCount === 0 && n >= 6) toitsuScore += 15;
    toitsuScore -= dupCount * 10; // 同牌2枚捨てたら七対子消える
    // ポンがあれば七対子は消えるが対子手(対々)の可能性
    if(ponMelds.length > 0){
      toitsuScore = Math.max(toitsuScore, 20); // 対々和系として残す
    }
    toitsuScore = Math.max(0, Math.min(toitsuScore, 70));

    // 【チャンタスコア】
    // 中張牌を積極的に捨て、端牌・字牌を温存
    let chantaScore = 0;
    if(n >= 3){
      const earlyMid = earlyDiscard.filter(t=>!MJ.isYaochu(t)&&!MJ.isHonor(t)&&(MJ.numOf(t)>=3&&MJ.numOf(t)<=7)).length;
      chantaScore += earlyMid * 10;
      // 端牌の捨て枚数が少ない = 端牌温存
      const termRatio = terminalCount / Math.max(suuhai,1);
      chantaScore += (1 - termRatio) * 15;
    }
    chantaScore = Math.max(0, Math.min(chantaScore, 50));

    // 【守備スコア】
    // 他家リーチ後に現物・字牌・端牌を切り出している
    let defScore = 0;
    if(otherRiichi && n >= 3){
      // リーチ後の捨て牌で安牌（字牌・端牌）の比率
      const riichiTurn = game.players.findIndex((q,i)=>i!==pid&&q.riichi);
      const riichiTurnIdx = riichiTurn>=0 ? game.players[riichiTurn].riichiTurn : 999;
      const afterRiichi = discards.filter((d,idx)=>idx>=riichiTurnIdx);
      if(afterRiichi.length > 0){
        const safeCount = afterRiichi.filter(d=>MJ.isYaochu(d.tile)).length;
        const safeRatio = safeCount / afterRiichi.length;
        defScore += safeRatio * 60;
        if(safeRatio >= 0.8) defScore += 20; // ほぼ完全ベタオリ
      }
    }
    // 残り少なくなったら守備モードの可能性
    if(remain <= 10 && n >= 5){
      const lastThree = discards.slice(-3);
      const safeLastThree = lastThree.filter(d=>MJ.isYaochu(d.tile)).length;
      defScore += safeLastThree * 5;
    }
    defScore = Math.max(0, Math.min(defScore, 80));

    // 捨て牌が少ない場合は不明度を高める
    let unknownScore = 0;
    if(n < 3) unknownScore = 60;
    else if(n < 5) unknownScore = 20;

    // --- 正規化（合計100%に） ---
    let raw = {
      '順子手': shunScore,
      '染め手': dyeScore,
      '対子/七対': toitsuScore,
      'チャンタ': chantaScore,
      '守備': defScore,
      '不明': unknownScore,
    };

    // 相互排他の調整
    // 染め手が高い場合、順子手と対子手も染め手の中にある可能性があるのでそのまま
    // 守備が高い場合、他が下がる（守備中は手の方向が見えにくい）
    if(defScore > 40){
      raw['順子手'] *= 0.5;
      raw['染め手'] *= 0.5;
      raw['対子/七対'] *= 0.5;
      raw['チャンタ'] *= 0.5;
    }

    const total = Object.values(raw).reduce((a,b)=>a+b, 0);
    const result = {};
    for(const k in raw){
      result[k] = total > 0 ? Math.round(raw[k]/total*100) : 0;
    }
    // 合計が100になるよう最大値で調整
    const rTotal = Object.values(result).reduce((a,b)=>a+b,0);
    if(rTotal !== 100){
      const keys = Object.keys(result).sort((a,b)=>result[b]-result[a]);
      result[keys[0]] += (100 - rTotal);
    }

    // 精度
    let accuracy, accuracyReason;
    if(n <= 2){
      accuracy = 'low';
      accuracyReason = '捨て牌が少なく傾向が読めません。字牌・端牌の序盤切りは多くの手で共通するため、判断材料が不足しています。';
    } else if(n <= 7){
      accuracy = 'mid';
      accuracyReason = '中張牌（3〜7）の温存傾向が見え始めています。ただし手変わりの可能性もあるため、断言はできません。';
    } else {
      accuracy = 'high';
      accuracyReason = '捨て牌の色・種類・順序から手の方向性が絞れています。' + (melds.length>0?'鳴きの種類も確度を上げています。':'');
    }

    // 点滅条件チェック
    const topScore = Math.max(...Object.values(result));
    const sorted = Object.entries(result).sort((a,b)=>b[1]-a[1]);
    const gap = sorted[0][1] - (sorted[1]?sorted[1][1]:0);
    const shouldBlink = n >= 5 && topScore >= 60 && gap >= 20;

    return { scores: result, accuracy, accuracyReason, discardCount: n, shouldBlink };
  }

  // ============================================================
  //  手牌傾向分析UI
  // ============================================================
  let analysisPid = null;    // 現在表示中のプレイヤー
  let analysisPanel = null;  // パネルDOM
  let analysisDragOfs = null;

  function toggleAnalysis(pid){
    // 同じボタンを押したら閉じる
    if(analysisPid === pid){
      closeAnalysisPanel(); return;
    }
    // 別のパネルが開いていたら警告
    if(analysisPid !== null){
      showAnalysisWarning(); return;
    }
    analysisPid = pid;
    openAnalysisPanel(pid);
    updateAnalysisBtn();
  }

  function showAnalysisWarning(){
    const w=$('#analysis-warning');
    if(!w) return;
    w.style.opacity='1'; w.style.pointerEvents='auto';
    clearTimeout(w._timer);
    w._timer=setTimeout(()=>{ w.style.opacity='0'; w.style.pointerEvents='none'; },2200);
  }

  function closeAnalysisPanel(){
    if(analysisPanel){ analysisPanel.remove(); analysisPanel=null; }
    // 点数パネルのハイライト解除
    document.querySelectorAll('.pinfo').forEach(p=>p.classList.remove('analysis-highlight'));
    analysisPid=null;
    updateAnalysisBtn();
  }

  function openAnalysisPanel(pid){
    if(analysisPanel){ analysisPanel.remove(); }
    // 対象プレイヤーの点数パネルを光らせる
    document.querySelectorAll('.pinfo').forEach(p=>p.classList.remove('analysis-highlight'));
    const targetPinfo=document.querySelector('#pinfo'+pid);
    if(targetPinfo) targetPinfo.classList.add('analysis-highlight');
    const panel=el('div','analysis-panel');
    panel.id='analysis-panel';
    // ドラッグ用ヘッダー
    const hdr=el('div','analysis-panel-hdr');
    hdr.innerHTML='<span class="analysis-panel-title"></span><button class="analysis-close-btn">✕</button>';
    hdr.querySelector('.analysis-close-btn').onclick=closeAnalysisPanel;
    // ドラッグ処理
    let dragging=false, dx=0, dy=0;
    hdr.addEventListener('mousedown',e=>{
      dragging=true; dx=e.clientX-panel.offsetLeft; dy=e.clientY-panel.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!dragging)return;
      panel.style.left=(e.clientX-dx)+'px';
      panel.style.top=(e.clientY-dy)+'px';
    });
    document.addEventListener('mouseup',()=>{ dragging=false; });
    // タッチ対応
    hdr.addEventListener('touchstart',e=>{
      const t=e.touches[0]; dragging=true;
      dx=t.clientX-panel.offsetLeft; dy=t.clientY-panel.offsetTop;
    },{passive:true});
    document.addEventListener('touchmove',e=>{
      if(!dragging)return;
      const t=e.touches[0];
      panel.style.left=(t.clientX-dx)+'px';
      panel.style.top=(t.clientY-dy)+'px';
    },{passive:true});
    document.addEventListener('touchend',()=>{ dragging=false; });
    panel.appendChild(hdr);
    const body=el('div','analysis-panel-body');
    panel.appendChild(body);
    document.getElementById('game-screen').appendChild(panel);
    // 初期位置: 画面中央右寄り
    panel.style.left=Math.min(window.innerWidth-260,window.innerWidth*0.6)+'px';
    panel.style.top='80px';
    analysisPanel=panel;
    refreshAnalysisPanel();
  }

  function refreshAnalysisPanel(){
    if(!analysisPanel||analysisPid===null) return;
    const names=['あなた','AI下家','AI対面','AI上家'];
    const windCh={27:'東',28:'南',29:'西',30:'北'};
    const result=analyzePlayer(analysisPid);
    const hdr=analysisPanel.querySelector('.analysis-panel-title');
    // 自風を取得してタイトルに表示
    const playerWind = game ? windCh[game.players[analysisPid].seatWind]||'' : '';
    hdr.textContent=names[analysisPid]+'（'+playerWind+'）の手牌傾向';
    const body=analysisPanel.querySelector('.analysis-panel-body');
    body.innerHTML='';
    if(!result){
      const p=el('div'); p.style.cssText='padding:12px;color:#9fb8a8;font-size:13px;';
      p.textContent='捨て牌がありません'; body.appendChild(p); return;
    }
    const {scores,accuracy,accuracyReason,discardCount}=result;
    // 精度インジケーター
    const accLabels=[
      {key:'low',label:'低',sub:'1〜2枚',cls:'acc-low'},
      {key:'mid',label:'中',sub:'3〜7枚',cls:'acc-mid'},
      {key:'high',label:'高',sub:'8枚〜',cls:'acc-high'},
    ];
    const accBar=el('div','acc-bar');
    accLabels.forEach(a=>{
      const s=el('div','acc-step '+(accuracy===a.key?a.cls+' acc-active':''));
      s.innerHTML=(accuracy===a.key?'★ ':'')+a.label+'<br><small>'+a.sub+'</small>';
      accBar.appendChild(s);
    });
    body.appendChild(accBar);
    // 精度の理由
    const reason=el('div','acc-reason');
    reason.textContent=accuracyReason;
    body.appendChild(reason);
    // 捨て牌枚数
    const cnt=el('div','discard-count');
    cnt.textContent='捨て牌 '+discardCount+'枚';
    body.appendChild(cnt);
    // スコアバー
    const sortedScores=Object.entries(scores).sort((a,b)=>b[1]-a[1]);
    const topKey=sortedScores[0][0];
    const COLORS={'順子手':'#1D9E75','染め手':'#378ADD','対子/七対':'#7F77DD','チャンタ':'#EF9F27','守備':'#E24B4A','不明':'#888780'};
    sortedScores.forEach(([k,v])=>{
      const row=el('div','score-row');
      const lbl=el('span','score-label');
      lbl.textContent=(k===topKey?'★':' ')+' '+k;
      if(k===topKey) lbl.classList.add('top-label');
      const track=el('div','score-track');
      const fill=el('div','score-fill');
      fill.style.width=v+'%';
      fill.style.background=COLORS[k]||'#888';
      track.appendChild(fill);
      const pct=el('span','score-pct');
      pct.textContent=v+'%';
      row.appendChild(lbl); row.appendChild(track); row.appendChild(pct);
      body.appendChild(row);
    });
  }

  function updateAnalysisBtn(){
    [1,2,3].forEach((pid,i)=>{
      const btn=$('#abtn-'+pid);
      if(!btn) return;
      btn.classList.toggle('active', analysisPid===pid);
      const result=game ? analyzePlayer(pid) : null;
      btn.classList.toggle('blink', !!(result&&result.shouldBlink));
    });
  }
  
  window.addEventListener('DOMContentLoaded',()=>{
    $('#btn-single').onclick=()=>startGame('single');
    $('#btn-tonpuu').onclick=()=>startGame('tonpuu');
    $('#btn-hanchan').onclick=()=>startGame('hanchan');
    const st=$('#sound-toggle');
    if(st) st.onclick=()=>{ const on=Sound.toggle(); st.textContent=on?'🔊':'🔇'; };
    const ib=$('#info-btn'), ibk=$('#info-back');
    if(ib) ib.onclick=()=>{ $('#info-screen').style.display='block'; };
    if(ibk) ibk.onclick=()=>{ $('#info-screen').style.display='none'; };
    [1,2,3].forEach(pid=>{ const btn=$('#abtn-'+pid); if(btn) btn.onclick=()=>{ if(game) toggleAnalysis(pid); }; });
    showTitle();
  });
})();
</script>
